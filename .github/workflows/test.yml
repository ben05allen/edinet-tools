name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - name: Install package
        run: uv sync
      - name: Ruff check
        run: uv run ruff check
      - name: Ty check
        run: uvx ty check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - name: Install package
        run: uv sync
      - name: Smoke tests
        run: uv run pytest -m smoke --no-cov --tb=short -q

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: uv sync
      - name: Unit tests
        run: uv run pytest -m unit --no-cov --tb=short -q
