[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "edinet-tools"
version = "0.7.1"
authors = [{ name = "Matt Helmer" }]
description = "Python package for accessing Japanese corporate financial data from EDINET"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
  "finance",
  "japan",
  "edinet",
  "financial-data",
  "xbrl",
  "corporate-filings",
]

dependencies = [
  "pandas>=1.3.0",
  "python-dateutil>=2.8.0",
  "chardet>=5.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
analysis = [
  "llm>=0.10.0",
  "pydantic>=2.0.0",
  "matplotlib>=3.3.0",
  "plotly>=5.0.0",
]

[project.urls]
"Homepage" = "https://github.com/matthelmer/edinet-tools"
"Repository" = "https://github.com/matthelmer/edinet-tools"
"Bug Reports" = "https://github.com/matthelmer/edinet-tools/issues"

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["edinet_tools"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=2.0.0",
  "sphinx>=4.0.0",
  "sphinx-rtd-theme>=1.0.0",
  "pandas-stubs>=2.3.3.260113",
  "ruff>=0.16.0",
]
